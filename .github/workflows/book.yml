name: Sách điện tử

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'docs/**'
      - 'README.md'
      - 'tools/build-ebook.mjs'
      - '.github/workflows/book.yml'
  pull_request:
    paths:
      - 'book/**'
      - 'docs/**'
      - 'README.md'
      - 'tools/build-ebook.mjs'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Máy chủ gói của Ubuntu đôi khi treo giữa chừng; đừng để job chờ cả tiếng
    timeout-minutes: 40
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tải lại khi một gói bị treo hoặc lỗi mạng, thay vì đứng chờ mãi
      - name: Cài pandoc và epubcheck
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60"
          sudo apt-get $APT update
          sudo apt-get $APT install -y pandoc epubcheck

      # TeX nặng khoảng 350 MB, mất 10–15 phút cài. Trên PR chỉ dựng và kiểm EPUB
      # (vẫn chạy bước lọc chữ Hán của bản PDF), PDF chỉ dựng khi vào main để đăng Release.
      - name: Cài xelatex và font để dựng PDF
        if: github.event_name != 'pull_request'
        run: |
          APT="-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60"
          sudo apt-get $APT install -y \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended lmodern \
            fonts-noto-core

      - name: Dựng EPUB và PDF
        env:
          BOOK_SKIP_PDF: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: node tools/build-ebook.mjs

      # EPUB hỏng thì job đỏ, nhưng không chặn bước đăng PDF bên dưới
      - name: Kiểm EPUB
        run: epubcheck dist/HowToLiveBetter-vi.epub

      - name: Lưu bản dựng
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sach-dien-tu
          path: |
            dist/HowToLiveBetter-vi.epub
            dist/HowToLiveBetter-vi.pdf
          if-no-files-found: warn

      - name: Đăng lên Release epub-latest
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(ls dist/HowToLiveBetter-vi.epub dist/HowToLiveBetter-vi.pdf 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "Không có file nào để đăng."
            exit 0
          fi
          if ! gh release view epub-latest >/dev/null 2>&1; then
            gh release create epub-latest \
              --title "Sách điện tử (bản mới nhất)" \
              --notes "EPUB và PDF dựng tự động từ book/ và docs/ của bản dịch tiếng Việt. Bản gốc: eternity4719/HowToLiveBetter (CC BY 4.0), bản dịch cũng phát hành theo CC BY 4.0."
          fi
          gh release upload epub-latest $files --clobber
